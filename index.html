@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cap{grid-column:2 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px;padding:4px 2px 0;font-size:12.5px;color:var(--ink3)}
.capr{display:flex;align-items:center;gap:8px}
.bdg{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:12px;font-weight:650;padding:2px 9px;border-radius:var(--r-pill);background:var(--p3);color:var(--ink2);white-space:nowrap}
.bdg svg{width:12px;height:12px}
.bdg.up{background:var(--ice-wash);color:var(--ice)}
.bdg.pr{background:var(--pr-bg);color:var(--pr-ink);box-shadow:0 0 18px -3px var(--pr-glow)}
.bdg.dn{background:transparent;color:var(--ink3)}
.rm{font-size:12.5px;color:var(--ink3);padding:2px 0;text-decoration:underline;text-decoration-color:var(--hair2);text-underline-offset:3px}
.addset{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 8px);margin:12px 4px 0;padding:13px;border-radius:var(--r-pill);background:var(--p2);color:var(--ink2);font-size:14px;font-weight:550}
.addset svg{width:16px;height:16px}

/* ---------- agenda ---------- */
.calp{padding:12px 12px 14px}
.mbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}
.mbar b{text-align:center;font-size:19px;font-weight:730;font-stretch:115%;letter-spacing:-.01em}
.mbar .ibtn{background:var(--p2);border-radius:var(--r-pill)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.dow span{text-align:center;font-size:11.5px;color:var(--ink4);font-weight:650}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{aspect-ratio:1;border-radius:calc(var(--r-tile) + 1px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  background:var(--p2);color:var(--ink3)}
.cd.void{background:transparent}
.cd.plan{background:transparent;box-shadow:inset 0 0 0 1.5px var(--p4);color:var(--ink2)}
.cd.miss{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(var(--sig-rgb),.6);color:var(--sig)}
.cd.done{background:var(--grad);color:var(--on-ice);font-weight:760;box-shadow:0 6px 16px -8px var(--ice-glow)}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.cd.done.today{box-shadow:inset 0 0 0 2px var(--on-ice),0 0 0 2px var(--ink);color:var(--on-ice)}
.cd i{font-style:normal;font-size:9px;font-weight:750;margin-top:1px;opacity:.72;letter-spacing:.02em}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 4px 0}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3)}
.legend i{width:12px;height:12px;border-radius:4px;display:block}
.legend .lg-done{background:var(--grad)}
.legend .lg-plan{box-shadow:inset 0 0 0 1.5px var(--p4)}
.legend .lg-miss{box-shadow:inset 0 0 0 1.5px rgba(var(--sig-rgb),.7)}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dpick button{border-radius:var(--r-md);padding:13px 0;font-size:14px;font-weight:650;color:var(--ink3);text-align:center;background:var(--p1);border:1px solid var(--hair);transition:background .2s,color .2s,border-color .2s}
.dpick button[aria-pressed="true"]{background:var(--ice-wash2);border-color:rgba(var(--ice-rgb),.45);color:var(--ice-hi)}

/* ---------- chiffres ---------- */
.figs{display:grid;grid-template-columns:1fr 1fr;background:var(--p1);border:1px solid var(--hair);border-radius:var(--r-xl);overflow:hidden;margin-top:12px}
.fig{display:flex;flex-direction:column;padding:15px 16px 16px;min-width:0}
.fig:nth-child(odd){border-right:1px solid var(--hair)}
.fig:nth-child(n+3){border-top:1px solid var(--hair)}
.fig .k{font-size:13px;color:var(--ink3);font-weight:500}
.fig .v{font-size:30px;font-weight:770;font-stretch:112%;line-height:1.1;margin-top:6px;letter-spacing:-.02em}
.fig .v small{font-size:13.5px;color:var(--ink3);font-weight:550;font-stretch:100%;margin-left:3px;letter-spacing:0}
.fig .d{font-size:12.5px;color:var(--ink3);margin-top:3px}
.fig .v.good{color:var(--ice)}
.fig .v.warn{color:var(--sig)}

/* ---------- onglets ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;margin:0 0 18px;background:var(--p1);border:1px solid var(--hair);border-radius:var(--r-pill)}
.seg button{padding:10px 4px;font-size:14px;color:var(--ink3);font-weight:600;text-align:center;border-radius:var(--r-pill);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--p3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(var(--w-rgb),.06)}
.seg.small{margin:0 0 12px}
.seg.small button{padding:8px 4px;font-size:13px}

/* ---------- graphiques ---------- */
.chart{--cbg:var(--p1);margin-top:4px;padding:14px 14px 12px;background:var(--cbg);border:1px solid var(--hair);border-radius:var(--r-xl)}
.chart svg{width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart .mk{stroke:var(--cbg)}
.ro{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:26px;font-size:13px;color:var(--ink3)}
.ro b{font-size:18px;color:var(--ink);font-weight:730;font-stretch:110%;white-space:nowrap}
.ro span{text-align:right}
.ckey{display:flex;gap:16px;margin-top:10px}
.ckey span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3)}
.ckey i{display:block}
.ckey .kl{width:16px;height:2px;border-radius:1px;background:var(--ice)}
.ckey .kd{width:8px;height:8px;border-radius:50%;background:var(--ink4)}
.ckey .kp{width:16px;height:0;border-top:2px dashed var(--ink3)}
.ax{fill:var(--ink3);font-size:10.5px;font-family:var(--f)}
.gl{stroke:var(--gl);stroke-width:1}

/* ---------- exercices ---------- */
.exr{display:grid;grid-template-columns:minmax(0,1fr) 58px 74px;gap:10px;align-items:center;width:100%;padding:13px 16px;text-align:left}
.exr .t{min-width:0}
.exr .t b{display:block;font-weight:620;font-size:15px;line-height:1.3}
.exr .t span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exr .v{text-align:right;font-size:17px;font-weight:730;font-stretch:110%;white-space:nowrap}
.exr .v small{font-size:12px;color:var(--ink3);font-weight:550;font-stretch:100%}
.spk{width:58px;height:22px}

/* ---------- niveau ---------- */
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl b{font-size:18px;font-weight:730;font-stretch:112%}
.lvl span{font-size:13px;color:var(--ink3)}
.gauge{height:8px;background:var(--p3);border-radius:4px;position:relative;margin-top:12px;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--grad-h);box-shadow:0 0 12px var(--ice-glow)}
.gt{display:flex;justify-content:space-between;margin-top:8px}
.gt span{font-size:11px;color:var(--ink4);font-weight:550}
.gt span.on{color:var(--ink);font-weight:700}

/* ---------- réglages ---------- */
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.ctl>div:first-child{min-width:0}
.ctl b{display:block;font-weight:620;font-size:15px}
.ctl span{display:block;font-size:13px;color:var(--ink3);line-height:1.4;margin-top:2px}
.mini{display:grid;grid-template-columns:40px 58px 40px;height:42px;background:var(--p2);border-radius:var(--r-pill);flex-shrink:0}
.mini button{font-size:19px;color:var(--ink2);display:grid;place-items:center;border-radius:var(--r-pill)}
.mini button:active{background:var(--p3);color:var(--ink)}
.mini button:disabled{opacity:.3}
.mini output{display:grid;place-items:center;font-weight:650;font-size:15px}
.sw{width:52px;height:32px;border-radius:16px;background:var(--p3);position:relative;flex-shrink:0;transition:background .25s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--ink3);transition:transform .25s var(--ease),background .25s}
.sw[aria-checked="true"]{background:var(--ice)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-ice)}
.sline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;font-size:14px;width:100%;text-align:left}
.sline span:first-child{color:var(--ink3)}
.sline span:last-child{text-align:right;color:var(--ink2)}
.foot{font-size:12.5px;color:var(--ink4);text-align:center;margin-top:36px;line-height:1.6}

/* ---------- corps ---------- */
.body{padding:16px 8px 14px}
.body svg{width:100%;height:auto}
.body .m{cursor:pointer;transition:fill .3s}
.body .m.sel{stroke:var(--sel);stroke-width:1.2;paint-order:stroke}
.hscale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 8px 0}
.hscale span{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--ink3);text-align:center}
.hscale i{display:block;height:6px;border-radius:3px}
.minfo{margin-top:12px;padding:16px}
.minfo h4{font-size:19px;font-weight:730;font-stretch:115%;letter-spacing:-.01em}
.minfo p{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.minfo p.mut{color:var(--ink3)}
.mlist .sline span:last-child em{font-style:normal;color:var(--ink3);margin-left:10px;display:inline-block;min-width:70px;text-align:left}

/* ---------- feuille et fenêtre ---------- */
#sheet,#modal{position:fixed;inset:0;pointer-events:none;z-index:20}
#modal{z-index:25}
#sheet.on,#modal.on{pointer-events:auto}
.veil{position:absolute;inset:0;background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s ease}
.veil.on{opacity:1}
.sheet{--p-sheet:var(--p1);position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;display:flex;flex-direction:column;
  background:var(--p1);border:1px solid var(--hair2);border-bottom:0;border-radius:var(--r-sheet);transform:translateY(104%);transition:transform .34s var(--ease)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--p4);margin:9px auto 0;flex-shrink:0}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 12px 12px 20px}
.sht{min-width:0}
.sht h3{font-size:24px;line-height:1.1;font-weight:790;font-stretch:120%;letter-spacing:-.02em}
.sht p{font-size:13.5px;color:var(--ink3);margin-top:6px}
.shead .ibtn{width:36px;height:36px;border-radius:var(--r-pill);background:var(--p2);margin-top:2px}
.shead .ibtn svg{width:18px;height:18px}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(28px + var(--safe-b))}
.sheet .figs,.sheet .chart{--cbg:var(--p2);background:var(--p2)}
.sheet .figs{margin-top:4px}
.sheet .group,.sheet .list{background:var(--p2)}
.sx{padding:13px 4px;border-bottom:1px solid var(--hair)}
.sxh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sxh b{font-weight:620;font-size:15px}
.sx p{font-size:14px;color:var(--ink2);margin-top:3px}
.modal{position:absolute;left:16px;right:16px;top:50%;max-width:420px;margin:0 auto;transform:translateY(-46%) scale(.98);opacity:0;
  background:var(--p1);border:1px solid var(--hair2);border-radius:var(--r-modal);padding:24px 20px 20px;transition:opacity .2s ease,transform .28s var(--ease);
  max-height:88%;overflow-y:auto;box-shadow:0 30px 80px -20px rgba(var(--k-rgb),.95)}
.modal.on{opacity:1;transform:translateY(-50%)}
.modal h3{font-size:22px;line-height:1.15;font-weight:790;font-stretch:118%;letter-spacing:-.015em}
.modal p{font-size:14.5px;color:var(--ink2);margin-top:9px;line-height:1.5}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.mact .btn{min-height:50px;font-size:15px}
.mact.three [data-m="alt"]{grid-column:1 / -1}
.fld{display:block;margin-top:16px}
.fld span{display:block;font-size:13px;color:var(--ink3);margin-bottom:7px}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;background:var(--p2);border-radius:var(--r-lg);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--ice);flex-shrink:0}
.chk b{display:block;font-weight:620;font-size:14.5px}
.chk small{display:block;font-size:13px;color:var(--ink3);line-height:1.45;margin-top:3px}
.steps{counter-reset:s;list-style:none;margin-top:6px}
.steps li{position:relative;padding:12px 0 12px 40px;border-bottom:1px solid var(--hair);font-size:14.5px;line-height:1.5;color:var(--ink2)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:2px;top:11px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;background:var(--ice-wash);color:var(--ice);font-size:13px;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--nav-gap) + var(--safe-b) + 14px);transform:translate(-50%,8px);width:max-content;max-width:calc(100% - 32px);
  z-index:30;padding:13px 20px;border-radius:var(--r-pill);background:var(--toast-bg);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--hair2);color:var(--toast-ink);font-weight:600;font-size:14.5px;text-align:center;line-height:1.35;
  opacity:0;transition:opacity .2s ease,transform .28s var(--ease);pointer-events:none;box-shadow:0 16px 40px -14px rgba(var(--k-rgb),.9)}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.typing #toast{bottom:calc(var(--safe-b) + 14px)}

/* ---------- barre flottante ---------- */
#nav{position:fixed;left:0;right:0;bottom:calc(var(--nav-gap) + var(--safe-b));z-index:10;padding:0 14px;pointer-events:none}
#nav .in{pointer-events:auto;max-width:440px;height:var(--nav-h);margin:0 auto;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  background:var(--nav-bg);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--nav-bd);border-radius:var(--r-pill);box-shadow:var(--nav-sh)}
#nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:var(--r-pill);
  color:var(--ink3);font-size:11px;font-weight:600;transition:color .2s,background .25s}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--nav-on-ink);background:var(--nav-on)}
#nav .dot{position:absolute;top:7px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--ice);box-shadow:0 0 8px var(--ice)}
body.typing #nav{display:none}
body.typing{padding-bottom:calc(var(--safe-b) + 24px)}

@supports (view-transition-name:none){
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:var(--ease)}
}

@media (max-width:359px){
  #view{padding-left:12px;padding-right:12px}
  .logbar{margin-left:-12px;margin-right:-12px}
  .cbody{padding:0 6px 12px}

}

  #view{padding-left:20px;padding-right:20px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

  const nx = ORDER.indexOf(nextKey());
  return '<ol class="rail" aria-label="Cycle des quatre séances">' + ORDER.map((k, i) =>
    '<li class="' + (i === on ? 'on' : (i < nx ? 'done' : '')) + '"' + (i === on ? ' aria-current="step"' : '') + '><i>' + SHORT[k] + '</i><span>' + esc(P[k].label) + '</span></li>').join('') + '</ol>';
}
function lastAgo(k) {
  const s = DB.sessions.filter(x => x.k === k).pop(); if (!s) return 'Première fois';
  const a = new Date(), b = new Date(s.d); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
  const d = Math.round((a - b) / 864e5);
  return 'Dernière fois ' + (d <= 0 ? 'aujourd’hui' : d === 1 ? 'hier' : d < 14 ? 'il y a ' + d + NB + 'jours' : 'il y a ' + Math.round(d / 7) + NB + 'semaines');
}

function weekStats() {
  const mon = monday(new Date()), byDay = sessionsByDay(), today = day0(new Date());
  const started = DB.sessions.length ? day0(DB.sessions[0].d) : day0(DB.created || new Date());
  let done = 0;
  const cells = DAYL.map((l, i) => {
    const d = addDays(mon, i), k = ymd(d), got = byDay[k], plan = DB.schedule.indexOf(i) >= 0 && d >= started;
    if (got) done += got.length;
    const cls = got ? 'done' : (plan && d < today ? 'miss' : (plan ? 'plan' : ''));
    return { l: l, cls: cls, today: +d === +today, label: DAYS[i] + (got ? ', séance faite' : plan ? ', prévue' : '') };
  });
  return { cells: cells, done: done, target: DB.schedule.length };
}
function streak() {
  const target = DB.schedule.length; if (!target || !DB.sessions.length) return { cur: 0, best: 0 };
  const cnt = {}; DB.sessions.forEach(s => { const k = ymd(monday(s.d)); cnt[k] = (cnt[k] || 0) + 1; });
  const thisMon = ymd(monday(new Date()));
  let run = 0, best = 0;
  for (let w = monday(DB.sessions[0].d); ymd(w) <= thisMon; w = addDays(w, 7)) {
    const k = ymd(w), c = cnt[k] || 0;
    if (c >= target) { run++; best = Math.max(best, run); } else if (k !== thisMon) run = 0;
  }
  return { cur: run, best: best };
}

  const w = weekStats(), st = streak();

function onSetInput(el) {

}

}

function projection(h) {

  const host = $('#sheet');
  $$('.veil,.sheet', host).forEach(e => e.classList.remove('on'));
  document.documentElement.classList.remove('locked');
  setTimeout(() => { if (!SHEET) { host.innerHTML = ''; host.classList.remove('on'); } }, REDUCED ? 0 : 280);
  if (!fromPop) { try { if (history.state && history.state.carnetSheet) history.back(); } catch (e) {} }
}
window.addEventListener('popstate', () => { if (SHEET) closeSheet(true); });

/* ───────────── fenêtre de dialogue ───────────── */
function modal(o) {
  return new Promise(res => {
    const host = $('#modal'), hasF = !!(o.fields && o.fields.length);
    let fh = '';
    (o.fields || []).forEach(f => {
      if (f.type === 'text') fh += '<label class="fld"><span>' + esc(f.label) + '</span><input type="text" data-k="' + f.k + '" value="' + esc(f.value || '') + '" maxlength="' + (f.max || 80) + '" autocomplete="off"></label>';
      if (f.type === 'area') fh += '<label class="fld"><span>' + esc(f.label) + '</span><textarea data-k="' + f.k + '" rows="6" spellcheck="false">' + esc(f.value || '') + '</textarea></label>';
      if (f.type === 'check') fh += '<label class="chk"><input type="checkbox" data-k="' + f.k + '"' + (f.value ? ' checked' : '') + '><span><b>' + esc(f.label) + '</b>' + (f.help ? '<small>' + esc(f.help) + '</small>' : '') + '</span></label>';
    });
    host.innerHTML = '<div class="veil"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h3 id="mTitle">' + esc(o.title) + '</h3>' + (o.text ? '<p>' + esc(o.text) + '</p>' : '') + fh +
      '<div class="mact' + (o.alt ? ' three' : '') + '">' + (o.alt ? '<button class="btn ghost" data-m="alt">' + esc(o.alt.label) + '</button>' : '') +
      '<button class="btn ghost" data-m="no">' + esc(o.cancel || 'Annuler') + '</button><button class="btn' + (o.danger ? ' red' : '') + '" data-m="ok">' + esc(o.ok || 'Valider') + '</button></div></div>';
    host.classList.add('on');
    requestAnimationFrame(() => $$('.veil,.modal', host).forEach(e => e.classList.add('on')));
    const prevFocus = document.activeElement;
    const done = v => {
      host.classList.remove('on'); host.innerHTML = ''; document.removeEventListener('keydown', key, true);
      try { if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true }); } catch (e) {}
      res(v);
    };
    const values = () => { const out = {}; $$('[data-k]', host).forEach(el => { out[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; }); return out; };
    host.querySelector('[data-m="ok"]').onclick = () => done(hasF ? values() : true);
    host.querySelector('[data-m="no"]').onclick = () => done(hasF ? null : false);
    const alt = host.querySelector('[data-m="alt"]'); if (alt) alt.onclick = () => done(o.alt.value);
    host.querySelector('.veil').onclick = () => done(hasF ? null : false);
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(hasF ? null : false); }
      if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') { e.preventDefault(); done(values()); }
    };
    document.addEventListener('keydown', key, true);
    const first = host.querySelector('input[type=text]');
    setTimeout(() => { try { if (first) { first.focus(); first.select(); } else host.querySelector('[data-m="ok"]').focus({ preventScroll: true }); } catch (e) {} }, 40);
  });
}
const ask = o => modal(o);

/* ───────────── message furtif ───────────── */
let toastT = null;
function toast(m) {
  const t = $('#toast'); if (!t) return;
  t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ───────────── actions ───────────── */
const A = {
  nav: t => { if (SHEET) closeSheet(); go(t.dataset.v); },
  start: t => startSession(t.dataset.k),
  resume: () => go('log'),
  abandon: () => abandon(),
  finish: () => finish(),
  toggle: t => {
    const c = +t.dataset.c, id = P[ACT.k].ex[c].n;
    ACT.open = ACT.open === id ? null : id; UI.noteEdit = null; saveAct();
    const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {}
    if (ACT.open) scrollToEl('#c' + c);
  },
  'kg-': t => stepField(+t.dataset.c, +t.dataset.i, 'kg', -1),
  'kg+': t => stepField(+t.dataset.c, +t.dataset.i, 'kg', 1),
  'r-': t => stepField(+t.dataset.c, +t.dataset.i, 'reps', -1),
  'r+': t => stepField(+t.dataset.c, +t.dataset.i, 'reps', 1),
  done: t => toggleDone(+t.dataset.c, +t.dataset.i),
  addset: t => {
    const c = +t.dataset.c, id = P[ACT.k].ex[c].n, arr = ACT.sets[id], last = arr[arr.length - 1];
    arr.push({ kg: last ? last.kg : '', reps: '', done: false, kt: false }); saveAct();
    const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {}
  },
  delset: t => {
    const c = +t.dataset.c, i = +t.dataset.i, id = P[ACT.k].ex[c].n, arr = ACT.sets[id];
    if (arr.length <= 1 || !arr[i]) return;
    arr.splice(i, 1); saveAct();
    const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {}
  },
  rename: t => renameEx(t.dataset.id || P[ACT.k].ex[+t.dataset.c].n),
  note: t => {
    UI.noteEdit = t.dataset.id;
    if (SHEET) paintSheet(false); else { const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {} }
    setTimeout(() => { const el = document.querySelector('[data-note]'); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }, 30);
  },
  sess: t => openSheet('sess', t.dataset.id),
  cday: t => { const got = sessionsByDay()[t.dataset.k]; if (got && got.length) openSheet('sess', got[got.length - 1].id); },
  sedit: t => editSession(t.dataset.id),
  sdel: async t => {
    const id = t.dataset.id, s = DB.sessions.find(x => x.id === id); if (!s) return;
    const ok = await ask({ title: 'Supprimer cette séance ?', text: P[s.k].label + ' du ' + fr(s.d, { day: 'numeric', month: 'long' }) + ' disparaîtra de l’historique et des statistiques.', ok: 'Supprimer', cancel: 'Garder', danger: true });
    if (!ok) return;
    saveUndo('Avant la suppression du ' + fr(s.d, { day: 'numeric', month: 'long' }));
    const isLast = DB.sessions[DB.sessions.length - 1].id === id;
    if (s.adv && !isLast) DB.base += 1;   // garde ta place dans le cycle
    DB.sessions = DB.sessions.filter(x => x.id !== id);
    if (ACT && ACT.mode === 'edit' && ACT.id === id) { ACT = null; saveAct(); }
    CTX = null; saveDB(true); closeSheet(); refreshAll(); toast('Séance supprimée');
  },
  exsheet: t => openSheet('ex', t.dataset.id),
  pseg: t => { UI.prog = t.dataset.s; render(); },
  bodyp: t => { UI.body = t.dataset.p; const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {} },
  muscle: t => { UI.muscle = UI.muscle === t.dataset.m ? null : t.dataset.m; const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {} },
  calm: t => { UI.cal += +t.dataset.d; render(); },
  sday: t => {
    const i = +t.dataset.d, a = DB.schedule.slice(), p = a.indexOf(i);
    if (p >= 0) a.splice(p, 1); else a.push(i);
    DB.schedule = a.sort((x, y) => x - y); saveDB(true);
    const y = window.pageYOffset || 0; render(); try { window.scrollTo(0, y); } catch (e) {}
  },
  wsave: () => {
    const el = $('#wIn'), dEl = $('#wDate'), dk = dEl && /^\d{4}-\d{2}-\d{2}$/.test(dEl.value) ? dEl.value : ymd(new Date());
    if (!el) return;
    if (dk > ymd(new Date())) { toast('Choisis une date passée ou aujourd’hui'); return; }
    if (saveWeight(dk, el.value)) { if (el.blur) el.blur(); refreshAll(); toast('Pesée enregistrée'); }
  },
  wdel: t => { DB.weights = DB.weights.filter(w => w.d !== t.dataset.d); saveDB(true); refreshAll(); toast('Pesée retirée'); },
  export: () => doExport(),
  import: () => pickImport(),
  textio: () => textIO(),
  restore: t => restoreCopy(t.dataset.c),
  wipe: () => wipe(),
  dlon: () => { DB.set.dlOn = !DB.set.dlOn; saveDB(true); refreshAll(); },
  dlev: t => { DB.set.dlEvery = Math.min(60, Math.max(9, DB.set.dlEvery + (+t.dataset.d))); DB.set.dlLen = Math.min(DB.set.dlLen, Math.floor(DB.set.dlEvery / 3)); saveDB(true); refreshAll(); },
  dlln: t => { DB.set.dlLen = Math.min(Math.floor(DB.set.dlEvery / 3), Math.max(1, DB.set.dlLen + (+t.dataset.d))); saveDB(true); refreshAll(); },
  bw: t => { DB.set.bw = Math.min(250, Math.max(35, r2(DB.set.bw + (+t.dataset.d)))); saveDB(true); refreshAll(); },
  inc: t => {
    const id = t.dataset.id, cur = incOf(id); let i = STEPS.indexOf(cur); if (i < 0) i = STEPS.indexOf(2.5);
    const nv = STEPS[Math.min(STEPS.length - 1, Math.max(0, i + (+t.dataset.d)))];
    if (nv === EX[id].inc) delete DB.inc[id]; else DB.inc[id] = nv;
    CTX = null; saveDB(true); refreshAll();
  },
  unname: t => { delete DB.names[t.dataset.id]; saveDB(true); refreshAll(); toast('Nom d’origine rétabli'); },
  close: () => closeSheet(),
  flashx: () => { FLASH = null; refreshAll(); },
  install: async () => {
    if (INSTALL) { try { INSTALL.prompt(); await INSTALL.userChoice; } catch (e) {} INSTALL = null; refreshAll(); return; }
    openSheet('install');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!t || t.disabled) return;
  const f = A[t.dataset.a]; if (!f) return;
  e.preventDefault();
  if (['toggle', 'kg-', 'kg+', 'r-', 'r+', 'done', 'addset', 'delset'].indexOf(t.dataset.a) >= 0 && !ACT) return;
  f(t, e);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.f) onSetInput(t);
  else if (t.dataset.note !== undefined) {
    const id = t.dataset.note, v = t.value.slice(0, 140);
    if (v.trim()) DB.notes[id] = v; else delete DB.notes[id];
    saveDB();
  }
});
document.addEventListener('focusin', e => {
  const t = e.target;
  if (t && t.matches && t.matches('input:not([type=checkbox]):not([type=date]),textarea') && !t.closest('#modal')) { if (COARSE) document.body.classList.add('typing'); }
  if (t && t.dataset && t.dataset.f) setTimeout(() => { try { if (document.activeElement === t) t.setSelectionRange(0, t.value.length); } catch (err) {} }, 0);
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t && t.dataset && t.dataset.f) tidyField(t);
  if (t && t.dataset && t.dataset.note !== undefined) { UI.noteEdit = null; saveDB(true); }
  setTimeout(() => { const a = document.activeElement; if (!a || !a.matches || !a.matches('input,textarea')) document.body.classList.remove('typing'); }, 80);
});
document.addEventListener('keydown', e => {
  const t = e.target; if (!t || !t.dataset) return;
  if (e.key === 'Enter' && t.dataset.f) {
    e.preventDefault();
    const c = t.dataset.c, i = t.dataset.i;
    if (t.dataset.f === 'kg') focusEl('#p' + c + '_' + i);
    else { tidyField(t); t.blur(); const s = ACT && ACT.sets[P[ACT.k].ex[+c].n][+i]; if (s && !s.done && setVal(s)) toggleDone(+c, +i); }
  }
  if (e.key === 'Enter' && t.dataset.note !== undefined) { e.preventDefault(); t.blur(); }
  if (e.key === 'Enter' && t.id === 'wIn') { e.preventDefault(); A.wsave(); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL = e; if (UI.view === 'set') refreshAll(); });
window.addEventListener('storage', e => {
  if (e.key === KEY.db && e.newValue) { const d = tryParse(e.newValue); if (d && d.v === 2) { DB = normalizeDB(d); CTX = null; refreshAll(); } }
});

/* ───────────── démarrage ───────────── */
async function init() {

  await loadAll();
  if (window.__CARNET_TEST__) window.__carnet = { get DB() { return DB; }, get ACT() { return ACT; }, get UI() { return UI; }, A: A, render: render, go: go, nextKey: nextKey, deload: deload, planFor: planFor, migrateV1: migrateV1, importText: importText, parseImport: parseImport, monthStats: monthStats, streak: streak, avgW: avgW, wRate: wRate, saveDB: saveDB, flushAll: flushAll };
  render();

    const reg = () => { try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {} };
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
}
init();
})();
